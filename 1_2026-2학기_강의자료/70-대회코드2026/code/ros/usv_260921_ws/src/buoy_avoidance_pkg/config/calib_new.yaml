# 카메라-라이다 보정값: 새 배 (하늘색 선체, 2026-11-06 센서 이전)
#   내부(f, cx, cy, dist): 기존과 같은 카메라라 calib_old 값 그대로 (내부까지 풀면 cx/cy 가 회전과 맞바뀜).
#   외부(rvec, tvec): 2026-11-12 오후, 라이다 교체 + 앞으로 연장 장착(뒤집은 상태, 드라이버 roll 180) 뒤
#     rosbag2_2026_11_12-13_34_35 (92 s 실주행) 로 다시 맞춤. 외부만 풀었다(내부 고정).
#     대응점 3,259쌍(25 px 게이트), 중앙 4.7 px / p90 11.3 px. 같은 대응점에 직전 값은 중앙 6.4 px.
#     ⚠️ 영상 header stamp 가 라이다 스캔보다 약 0.82 s 이른 영상과 짝지어야 잔차가 최소다
#        (시간차를 -1.10~+0.30 s 로 바꿔가며 맞춤. 이 bag 의 영상 수신-헤더 차는 0.84 s).
#        tvec z(앞뒤)는 이 시간차와 맞바뀐다: 시간차 ±0.04 s 에 0.29~0.37. 정지 구간만으로 맞춰도 0.34.
#     구간·짝홀·정지/주행으로 나눠 다시 맞춘 범위: pitch -0.033~-0.048 rad, tvec y 0.06~0.13, tvec x -0.06~+0.03, tvec z 0.31~0.34.
#     오른쪽 가장자리(방위 +40° 밖) 부표는 중앙 8.2 px 로 덜 맞는다.
#     이전 값: 뒤집기만 한 상태(09_39_38 bag) rvec [-0.0355, -0.0210, -0.0123], tvec [-0.001, 0.086, 0.211]
#              뒤집기 전(2026-11-06 bag 3개)   rvec [-0.0196, 0.0116, -0.0033],  tvec [-0.093, 0.185, 0.254] — git 8fb8763.
# 선택: ros2 launch buoy_avoidance_pkg buoy_avoidance.launch.py calib:=new   (기본값)
# buoy_params.yaml 뒤에 로드되어 cam_* 를 덮어쓴다.
buoy_avoidance:
  ros__parameters:
    cam_width: 640
    cam_height: 480
    cam_fx: 239.08
    cam_fy: 239.08
    cam_cx: 315.77
    cam_cy: 233.47
    cam_dist: [-0.0180, -0.0151, 0.0, 0.0]
    cam_rvec_correction: [-0.0382, -0.0080, -0.0024]  # 광학 프레임 추가 회전 (rad)
    cam_tvec: [0.016, 0.107, 0.328]                 # 광학 프레임에서 본 라이다 원점 (m): 오른쪽, 아래, 앞
    cam_valid_radius_px: 330.0

  <line x1="40" y1="348" x2="860" y2="348" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="372" font-size="16" fill="#334155">제어 대상 3자유도 : Surge · Sway · Yaw</text>
  <text x="470" y="372" font-size="16" fill="#64748b">파랑 진동으로 보고 제외 : Heave · Roll · Pitch</text>

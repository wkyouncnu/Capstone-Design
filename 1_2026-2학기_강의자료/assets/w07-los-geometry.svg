<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="aro" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#d97706"/></marker>
  </defs>

  <text x="20" y="32" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="700" fill="#1e293b">LOS 유도의 기하</text>
  <text x="20" y="56" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#64748b">경로 위의 한 점을 겨냥한다. 그 점은 가장 가까운 지점보다 &#916; 만큼 앞이다</text>

  <line x1="58" y1="330" x2="58" y2="220" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="58" y1="330" x2="168" y2="330" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="38" y="216" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#64748b">N</text>
  <text x="176" y="336" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#64748b">E</text>

  <line x1="230" y1="352" x2="720" y2="156" stroke="#0d9488" stroke-width="3"/>
  <text x="252" y="316" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#0d9488">계획 경로</text>

  <circle cx="230" cy="352" r="7" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="720" cy="156" r="7" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <text x="164" y="378" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#0d9488">웨이포인트 k</text>
  <text x="746" y="122" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#0d9488">k+1</text>
  <circle cx="720" cy="156" r="44" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="772" y="196" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#0d9488">수락반경 R</text>

  <line x1="230" y1="352" x2="230" y2="238" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M230,284 A 68 68 0 0 1 272,268" fill="none" stroke="#334155" stroke-width="1.6"/>
  <text x="196" y="242" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#334155">&#960;</text>
  <text x="208" y="248" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#334155">p</text>
  <text x="222" y="228" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#334155">경로 방위각</text>

  <line x1="430" y1="342" x2="398" y2="262" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr)"/>
  <circle cx="398" cy="262" r="4.5" fill="#dc2626"/>
  <text x="376" y="322" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#dc2626">y</text>
  <text x="388" y="328" font-family="Malgun Gothic, sans-serif" font-size="13" fill="#dc2626">e</text>

  <line x1="398" y1="262" x2="540" y2="205" stroke="#d97706" stroke-width="2.6" marker-end="url(#aro)"/>
  <text x="456" y="220" font-family="Malgun Gothic, sans-serif" font-size="19" fill="#d97706">&#916;</text>
  <circle cx="540" cy="205" r="6" fill="#d97706"/>
  <text x="552" y="192" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#d97706">조준점</text>

  <line x1="430" y1="342" x2="540" y2="205" stroke="#1d4ed8" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#arb)"/>
  <line x1="430" y1="342" x2="430" y2="244" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <path d="M430,290 A 56 56 0 0 1 466,302" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="474" y="298" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#1d4ed8">&#968;</text>
  <text x="486" y="304" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#1d4ed8">ref</text>
  <text x="504" y="298" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#1d4ed8">유도 지령</text>

  <g transform="translate(430,342) rotate(38)">
    <path d="M0,-16 L9,4 L0,14 L-9,4 Z" fill="#1e293b"/>
  </g>
  <text x="446" y="368" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#1e293b">배</text>

  <rect x="20" y="396" width="860" height="60" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="38" y="422" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#1e293b">&#968;</text>
  <text x="49" y="428" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#1e293b">ref</text>
  <text x="68" y="422" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#1e293b">= &#960;</text>
  <text x="98" y="428" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#1e293b">p</text>
  <text x="110" y="422" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#1e293b">&#8722; atan( y</text>
  <text x="192" y="428" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#1e293b">e</text>
  <text x="201" y="422" font-family="Malgun Gothic, sans-serif" font-size="17" fill="#1e293b">/ &#916; )</text>
  <text x="270" y="422" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#64748b">경로에서 멀수록 경로 쪽으로 더 크게 꺾는다</text>
  <text x="38" y="446" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#dc2626">y</text>
  <text x="47" y="450" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#dc2626">e</text>
  <text x="58" y="446" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#334155">= 경로 이탈량 (cross-track error)</text>
  <text x="352" y="446" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#334155">&#916; = lookahead distance,   R = 웨이포인트 도달 판정 반경</text>
</svg>

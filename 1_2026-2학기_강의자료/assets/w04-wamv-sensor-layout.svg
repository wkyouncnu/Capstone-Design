<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" font-family="Malgun Gothic, sans-serif">
<rect width="920" height="700" fill="#ffffff"/>

<text x="20" y="30" font-size="19" font-weight="bold" fill="#1e293b">WAM-V 센서 장착 위치 — base_link 기준 실측값</text>
<text x="20" y="52" font-size="14" fill="#64748b">VRX 2.4.1 실행 중 TF 에서 측정 (2026-09-06). 선체 좌표계는 x 전방 · y 좌현 · z 상방 (ENU 계열)</text>

<!-- ================= 평면도 ================= -->
<text x="20" y="90" font-size="16" font-weight="bold" fill="#334155">평면도 — 위에서 본 모습</text>
<text x="20" y="110" font-size="13" fill="#64748b">x 오른쪽 = 뱃머리 방향 · y 위쪽 = 좌현</text>

<!-- 좌현/우현 선체 -->
<rect x="290" y="126" width="410" height="34" rx="17" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<rect x="290" y="256" width="410" height="34" rx="17" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="706" y="147" font-size="13" fill="#1d4ed8">좌현 선체  y = +1.03 m</text>
<text x="706" y="277" font-size="13" fill="#1d4ed8">우현 선체  y = −1.03 m</text>

<!-- 갑판 -->
<rect x="478" y="170" width="106" height="76" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="500" y="240" font-size="12" fill="#94a3b8">갑판</text>

<!-- 중심선 · 기준축 -->
<line x1="290" y1="208" x2="720" y2="208" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<circle cx="600" cy="208" r="5" fill="#dc2626"/>
<text x="596" y="196" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="end">base_link</text>
<line x1="600" y1="208" x2="672" y2="208" stroke="#dc2626" stroke-width="2"/>
<polygon points="672,208 662,204 662,212" fill="#dc2626"/>
<text x="676" y="204" font-size="13" fill="#dc2626">x</text>
<line x1="600" y1="208" x2="600" y2="150" stroke="#0d9488" stroke-width="2"/>
<polygon points="600,150 596,160 604,160" fill="#0d9488"/>
<text x="606" y="152" font-size="13" fill="#0d9488">y</text>

<!-- 센서: 평면 -->
<!-- 3D LiDAR x=0.70 y=0 -->
<circle cx="667" cy="208" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="700" y="214" font-size="12" fill="#dc2626">3D LiDAR</text>
<!-- Livox x=0.70 y=0 (같은 x, 아래쪽에 표기) -->
<circle cx="667" cy="222" r="6" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="700" y="232" font-size="12" fill="#d97706">Livox Mid-360</text>
<!-- 카메라 전방 좌/우 x=0.75 y=±0.10 -->
<rect x="668" y="188" width="11" height="9" fill="#0d9488"/>
<rect x="668" y="228" width="11" height="9" fill="#0d9488"/>
<text x="686" y="182" font-size="12" fill="#0d9488">전방 카메라 2대</text>
<!-- 중앙우현 카메라 x=0.50 y=-0.45 -->
<rect x="641" y="248" width="11" height="9" fill="#0d9488"/>
<text x="452" y="312" font-size="12" fill="#0d9488">우현 카메라 (−90°)</text><line x1="530" y1="308" x2="645" y2="256" stroke="#0d9488" stroke-width="0.9"/>
<!-- GPS x=-0.85 -->
<circle cx="519" cy="208" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
<text x="486" y="199" font-size="12" fill="#1d4ed8">GPS</text>
<!-- IMU x=0.30 y=-0.20 -->
<rect x="623" y="220" width="11" height="11" fill="#7c3aed"/>
<text x="596" y="292" font-size="12" fill="#7c3aed">IMU</text><line x1="608" y1="284" x2="626" y2="233" stroke="#7c3aed" stroke-width="0.9"/>
<!-- 추진기 x=-2.374 y=±1.027 -->
<rect x="367" y="132" width="26" height="22" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<rect x="367" y="262" width="26" height="22" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="300" y="120" font-size="12" fill="#d97706">좌 추진기  x = −2.37</text>
<text x="300" y="304" font-size="12" fill="#d97706">우 추진기  x = −2.37</text>

<!-- 눈금 -->
<line x1="290" y1="330" x2="700" y2="330" stroke="#94a3b8"/>
<line x1="600" y1="326" x2="600" y2="334" stroke="#94a3b8"/>
<text x="592" y="348" font-size="11" fill="#64748b">0</text>
<line x1="505" y1="326" x2="505" y2="334" stroke="#94a3b8"/>
<text x="491" y="348" font-size="11" fill="#64748b">−1 m</text>
<line x1="410" y1="326" x2="410" y2="334" stroke="#94a3b8"/>
<text x="396" y="348" font-size="11" fill="#64748b">−2 m</text>
<line x1="315" y1="326" x2="315" y2="334" stroke="#94a3b8"/>
<text x="301" y="348" font-size="11" fill="#64748b">−3 m</text>
<line x1="695" y1="326" x2="695" y2="334" stroke="#94a3b8"/>
<text x="686" y="348" font-size="11" fill="#64748b">+1 m</text>

<!-- ================= 측면도 ================= -->
<text x="20" y="410" font-size="16" font-weight="bold" fill="#334155">측면도 — 옆에서 본 모습</text>
<text x="290" y="430" font-size="13" fill="#64748b">x 오른쪽 = 뱃머리 · z 위쪽 = 상방. 수면은 z ≈ 0</text>

<!-- 수면 -->
<line x1="290" y1="600" x2="760" y2="600" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="8 4"/>
<text x="766" y="604" font-size="12" fill="#1d4ed8">수면</text>
<!-- 선체 -->
<rect x="290" y="583" width="410" height="30" rx="15" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<!-- 마스트 구조 -->
<line x1="600" y1="583" x2="600" y2="470" stroke="#94a3b8" stroke-width="3"/>
<line x1="667" y1="583" x2="667" y2="452" stroke="#94a3b8" stroke-width="3"/>
<line x1="519" y1="583" x2="519" y2="500" stroke="#94a3b8" stroke-width="3"/>
<!-- 기준점 -->
<circle cx="600" cy="583" r="5" fill="#dc2626"/>
<text x="556" y="576" font-size="13" font-weight="bold" fill="#dc2626">base_link</text>
<line x1="600" y1="583" x2="600" y2="530" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>

<!-- 센서: 측면 (z 1 m = 57 px) -->
<circle cx="667" cy="480" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="684" y="478" font-size="12" fill="#dc2626">3D LiDAR   z = 1.80 m</text>
<circle cx="667" cy="543" r="7" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
<text x="684" y="547" font-size="12" fill="#d97706">Livox Mid-360   z = 0.71 m</text>
<rect x="662" y="495" width="12" height="10" fill="#0d9488"/>
<text x="684" y="503" font-size="12" fill="#0d9488">전방 카메라   z = 1.50 m</text>
<circle cx="519" cy="509" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
<text x="330" y="500" font-size="12" fill="#1d4ed8">GPS   x = −0.85, z = 1.30 m</text>
<rect x="623" y="503" width="11" height="11" fill="#7c3aed"/>
<text x="470" y="464" font-size="12" fill="#7c3aed">IMU   z = 1.30 m</text>
<line x1="600" y1="470" x2="629" y2="503" stroke="#7c3aed" stroke-width="1"/>
<!-- 추진기 -->
<rect x="367" y="572" width="26" height="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<circle cx="355" cy="611" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="180" y="640" font-size="12" fill="#d97706">추진기 z = 0.32 · 프로펠러 z = −0.19 (수면 아래)</text>
<line x1="330" y1="632" x2="352" y2="617" stroke="#d97706" stroke-width="1"/>

<!-- 범례 -->
<rect x="20" y="130" width="250" height="200" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="34" y="154" font-size="13" font-weight="bold" fill="#334155">기호</text>
<circle cx="44" cy="176" r="7" fill="#dc2626"/><text x="60" y="181" font-size="12" fill="#334155">3D LiDAR (16채널)</text>
<circle cx="44" cy="202" r="6" fill="#d97706"/><text x="60" y="207" font-size="12" fill="#334155">Livox Mid-360</text>
<rect x="38" y="222" width="12" height="10" fill="#0d9488"/><text x="60" y="232" font-size="12" fill="#334155">카메라 (3대)</text>
<circle cx="44" cy="252" r="7" fill="#1d4ed8"/><text x="60" y="257" font-size="12" fill="#334155">GPS</text>
<rect x="38" y="272" width="11" height="11" fill="#7c3aed"/><text x="60" y="282" font-size="12" fill="#334155">IMU</text>
<rect x="36" y="298" width="16" height="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="60" y="308" font-size="12" fill="#334155">추진기 · 프로펠러</text>

<!-- 주의 -->
<rect x="20" y="430" width="250" height="120" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="34" y="454" font-size="13" font-weight="bold" fill="#dc2626">부호에 주의</text>
<text x="34" y="476" font-size="12" fill="#334155">이 그림의 y 는 <tspan font-weight="bold">좌현이 양(+)</tspan> 이다.</text>
<text x="34" y="496" font-size="12" fill="#334155">7주차 이후 제어 수식은 NED</text>
<text x="34" y="514" font-size="12" fill="#334155">(우현이 양) 를 쓰므로 y 부호가</text>
<text x="34" y="532" font-size="12" fill="#334155">반대가 된다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Malgun Gothic, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Gazebo 는 두 프로세스가 각자 그림을 그린다</text>

  <!-- 서버 -->
  <rect x="40" y="60" width="400" height="170" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="90" font-size="18" font-weight="bold" fill="#1d4ed8">① 서버  gz sim -s</text>
  <text x="60" y="122" font-size="16" fill="#334155">물리 계산 — 파도 · 부력 · 추진기</text>
  <rect x="60" y="138" width="360" height="74" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-dasharray="5 4"/>
  <text x="76" y="166" font-size="16" fill="#334155">센서 렌더링 — 카메라 3대 · 3D LiDAR</text>
  <text x="76" y="194" font-size="15" fill="#64748b">물리와 같은 스레드에서 매 순간 그림</text>

  <!-- GUI -->
  <rect x="520" y="60" width="400" height="170" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="540" y="90" font-size="18" font-weight="bold" fill="#d97706">② GUI  gz sim -g</text>
  <text x="540" y="122" font-size="16" fill="#334155">마우스 조작 · 창 · RTF 표시</text>
  <rect x="540" y="138" width="360" height="74" rx="8" fill="#ffffff" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="556" y="166" font-size="16" fill="#334155">3D 화면 — 바다 · 배 · 해안 · 하늘</text>
  <text x="556" y="194" font-size="15" fill="#64748b">한 장을 다 그려야 다음 조작을 받음</text>

  <!-- 경로 -->
  <line x1="240" y1="212" x2="240" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="212" x2="720" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="286" width="880" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="316" font-size="17" font-weight="bold" fill="#dc2626">기본 렌더 엔진 ogre2</text>
  <text x="60" y="346" font-size="16" fill="#334155">ogre2 → WSL 의 D3D12 변환 층 (Mesa) → Windows → Intel 그래픽</text>
  <text x="60" y="372" font-size="15" fill="#64748b">Intel 그래픽 노트북에서 이 경로가 극단적으로 느림 — 한 장에 약 1 초</text>

  <!-- 증상 -->
  <line x1="240" y1="382" x2="240" y2="420" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <line x1="720" y1="382" x2="720" y2="420" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <text x="240" y="444" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">RTF 0.018 — 시간이 거의 안 흐름</text>
  <text x="720" y="444" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">화면 1 fps — 마우스 반응 없음</text>

  <!-- 해법 -->
  <rect x="40" y="466" width="400" height="78" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="60" y="494" font-size="16" font-weight="bold" fill="#0d9488">해법 1 · 안 쓰는 센서를 끔</text>
  <text x="60" y="522" font-size="15" fill="#334155">wamv_lite.urdf — GPS · IMU · 참값만</text>
  <rect x="520" y="466" width="400" height="78" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="540" y="494" font-size="16" font-weight="bold" fill="#0d9488">해법 2 · GUI 엔진을 ogre 로</text>
  <text x="540" y="522" font-size="15" fill="#334155">--render-engine-gui ogre → 약 50 fps</text>
</svg>

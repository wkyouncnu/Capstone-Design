<svg xmlns="http://www.w3.org/2000/svg" width="900" height="830" viewBox="0 0 900 830" font-family="Malgun Gothic, sans-serif">
  <rect width="900" height="830" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="19" font-weight="bold" fill="#1e293b">미션 상태기계 — 어느 조건에서 다음 단계로 넘어가는가</text>

  <!-- default transition -->
  <line x1="150" y1="48" x2="150" y2="86" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="150" cy="48" r="6" fill="#334155"/>
  <text x="180" y="72" font-size="15" fill="#64748b">기본 전이 — 시작하면 조건 없이 첫 상태로 들어감</text>

  <!-- 1 WpFollow -->
  <rect x="60" y="90" width="420" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="82" y="122" font-size="18" font-weight="bold" fill="#1d4ed8">WpFollow · mode = 1 — 웨이포인트 추종</text>
  <text x="82" y="150" font-size="15" fill="#334155">LOS 유도가 선수각을 냄 · 전진 속도는 u_ref 고정</text>
  <text x="82" y="170" font-size="15" fill="#64748b">WP1 → WP2 → WP3 … 순서대로</text>

  <line x1="150" y1="176" x2="150" y2="244" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="180" y="204" font-size="16" font-weight="bold" fill="#dc2626">[at_loiter &gt; 0.5]</text>
  <text x="180" y="228" font-size="15" fill="#334155">로이터 웨이포인트(WP3)까지 거리가 R_LOS = 5 m 안</text>

  <!-- 2 Loiter -->
  <rect x="60" y="248" width="420" height="86" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="82" y="280" font-size="18" font-weight="bold" fill="#0d9488">Loiter · mode = 2 — 제자리 선회</text>
  <text x="82" y="308" font-size="15" fill="#334155">벡터필드 유도가 선수각을 냄 · 전진 속도는 u_ref 고정</text>
  <text x="82" y="328" font-size="15" fill="#64748b">반경 18 m 원을 돈다. 웨이포인트 번호는 멈춰 있다</text>

  <line x1="150" y1="334" x2="150" y2="402" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="180" y="362" font-size="16" font-weight="bold" fill="#dc2626">[turns &gt;= req_turns]</text>
  <text x="180" y="386" font-size="15" fill="#334155">선회한 누적각이 2 바퀴를 채움</text>

  <!-- 3 WpFollow again -->
  <rect x="60" y="406" width="420" height="86" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="82" y="438" font-size="18" font-weight="bold" fill="#1d4ed8">WpFollow · mode = 1 — 다시 웨이포인트 추종</text>
  <text x="82" y="466" font-size="15" fill="#334155">같은 상태로 돌아옴. 새 상태를 만들지 않는다</text>
  <text x="82" y="486" font-size="15" fill="#64748b">멈춰 있던 WP3 부터 이어서 간다</text>

  <line x1="150" y1="492" x2="150" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="180" y="520" font-size="16" font-weight="bold" fill="#dc2626">[at_end &gt; 0.5]</text>
  <text x="180" y="544" font-size="15" fill="#334155">마지막 웨이포인트(WP5)까지 거리가 5 m 안</text>

  <!-- 4 Dock -->
  <rect x="60" y="564" width="420" height="86" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="82" y="596" font-size="18" font-weight="bold" fill="#d97706">Dock · mode = 3 — 접안</text>
  <text x="82" y="624" font-size="15" fill="#334155">유도를 끊고 위치제어가 받는다 · 속도 지령이 바뀜</text>
  <text x="82" y="644" font-size="15" fill="#64748b">접근점 → 자세 맞춤 → 순수 옆걸음</text>

  <line x1="150" y1="650" x2="150" y2="718" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="180" y="678" font-size="16" font-weight="bold" fill="#dc2626">[phase &gt; 2.5]</text>
  <text x="180" y="702" font-size="15" fill="#334155">접안 3단계가 끝남 — 선석까지 1.5 m 안</text>

  <!-- 5 Finish -->
  <rect x="60" y="722" width="420" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="82" y="754" font-size="18" font-weight="bold" fill="#475569">Finish · mode = 4 — 접안 완료</text>
  <text x="82" y="782" font-size="15" fill="#334155">기준점을 선석에 둔 채 위치제어로 자리를 지킨다</text>

  <!-- right rail: 조건을 만드는 블록 -->
  <text x="600" y="122" font-size="15" font-weight="bold" fill="#1e293b">조건을 만드는 곳</text>
  <line x1="600" y1="132" x2="870" y2="132" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="162" font-size="15" fill="#334155">at_loiter · at_end</text>
  <text x="600" y="184" font-size="15" fill="#64748b">WpManager (유도부)</text>
  <text x="600" y="222" font-size="15" fill="#334155">turns</text>
  <text x="600" y="244" font-size="15" fill="#64748b">TurnCount (유도부)</text>
  <text x="600" y="282" font-size="15" fill="#334155">phase</text>
  <text x="600" y="304" font-size="15" fill="#64748b">BerthRef (유도부)</text>
  <text x="600" y="342" font-size="15" fill="#334155">req_turns</text>
  <text x="600" y="364" font-size="15" fill="#64748b">설정값 loiter_turns</text>
  <text x="600" y="412" font-size="15" fill="#64748b">상태기계는 조건을 만들지</text>
  <text x="600" y="434" font-size="15" fill="#64748b">않는다. 받아서 고를 뿐이다</text>
</svg>

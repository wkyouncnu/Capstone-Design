<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="g1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="o1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#d97706"/></marker>
    <marker id="b1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="r1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="t1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#0d9488"/></marker>
  </defs>

  <text x="20" y="32" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="700" fill="#1e293b">뱃머리가 향한 곳과 배가 가는 곳은 다르다</text>
  <text x="20" y="56" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#64748b">조류가 있으면 두 방향이 어긋난다. 그 차이가 크랩각 &#946; 다</text>

  <line x1="70" y1="340" x2="70" y2="120" stroke="#64748b" stroke-width="1.6" marker-end="url(#g1)"/>
  <text x="50" y="114" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#64748b">N</text>

  <line x1="330" y1="310" x2="330" y2="140" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>

  <line x1="330" y1="310" x2="440" y2="156" stroke="#1d4ed8" stroke-width="3" marker-end="url(#b1)"/>
  <line x1="330" y1="310" x2="520" y2="204" stroke="#0d9488" stroke-width="3" marker-end="url(#t1)"/>
  <line x1="443" y1="152" x2="520" y2="204" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#r1)"/>

  <line x1="446" y1="150" x2="588" y2="116" stroke="#cbd5e1" stroke-width="1"/>
  <text x="596" y="112" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#1d4ed8">&#968;   선수각</text>
  <text x="596" y="136" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#1d4ed8">뱃머리가 향한 방향</text>

  <line x1="528" y1="204" x2="588" y2="200" stroke="#cbd5e1" stroke-width="1"/>
  <text x="596" y="196" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#0d9488">&#967;   침로각</text>
  <text x="596" y="220" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#0d9488">배가 실제로 가는 방향</text>

  <line x1="486" y1="180" x2="588" y2="272" stroke="#cbd5e1" stroke-width="1"/>
  <text x="596" y="278" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#dc2626">조류가 옆으로 밀어낸 만큼</text>

  <path d="M330,232 A 78 78 0 0 1 378,252" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="340" y="240" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#1d4ed8">&#968;</text>
  <path d="M388,236 A 126 126 0 0 1 414,264" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text x="394" y="258" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#dc2626">&#946;</text>

  <g transform="translate(330,310) rotate(35)">
    <path d="M0,-20 L11,5 L0,18 L-11,5 Z" fill="#1e293b"/>
  </g>

  <line x1="118" y1="196" x2="228" y2="256" stroke="#d97706" stroke-width="3" marker-end="url(#o1)"/>
  <text x="112" y="182" font-family="Malgun Gothic, sans-serif" font-size="16" fill="#d97706">조류</text>
  <line x1="118" y1="240" x2="228" y2="300" stroke="#d97706" stroke-width="2" opacity="0.45"/>
  <line x1="118" y1="152" x2="228" y2="212" stroke="#d97706" stroke-width="2" opacity="0.45"/>

  <rect x="20" y="352" width="860" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="38" y="380" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#1e293b">&#967; = &#968; + &#946;</text>
  <text x="160" y="380" font-family="Malgun Gothic, sans-serif" font-size="18" fill="#1e293b">&#946; = atan2( v, u )</text>
  <text x="340" y="380" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#64748b">u, v = 선체 기준 전후 속도, 좌우 속도</text>
  <text x="38" y="406" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#334155">선수각 &#968; 만 제어하면 배는 경로에서 옆으로 밀린 채 나아간다. 조류에서 경로 이탈이 남는 이유다</text>
</svg>

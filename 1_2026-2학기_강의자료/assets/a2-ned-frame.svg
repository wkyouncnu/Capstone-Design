<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="600" viewBox="0 0 1020 600" font-family="Malgun Gothic, sans-serif">
  <rect width="1020" height="600" fill="#ffffff"/>

  <defs>
    <marker id="a2n-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="a2n-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a2n-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <marker id="a2n-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="36" y="44" font-size="21" font-weight="bold" fill="#1e293b">NED 좌표계 — 접평면 위의 북(N) · 동(E) · 아래(D)</text>
  <text x="36" y="72" font-size="15" fill="#64748b">D 축은 지구 중심을 향하지 않는다. 타원체면 법선의 아래쪽이다</text>

  <text x="250" y="118" font-size="17" font-weight="bold" fill="#334155" text-anchor="middle">[1] 지구 위의 한 점에서 본 NED</text>
  <text x="720" y="118" font-size="17" font-weight="bold" fill="#334155" text-anchor="middle">[2] 자오선 단면 (찌그러짐 과장)</text>

  <!-- ================= 패널 1 ================= -->
  <circle cx="250" cy="300" r="135" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="250" cy="300" rx="135" ry="70.2" transform="rotate(73.5 250 300)"
           fill="none" stroke="#1d4ed8" stroke-width="1.6"/>
  <ellipse cx="250" cy="300" rx="135" ry="57.1"
           fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5"/>
  <line x1="250" y1="300" x2="250" y2="154" stroke="#334155" stroke-width="2" marker-end="url(#a2n-gray)"/>
  <circle cx="250" cy="300" r="3.5" fill="#334155"/>
  <text x="250" y="142" font-size="17" font-weight="bold" fill="#1e293b" text-anchor="middle">ê3</text>

  <!-- 접평면 -->
  <polygon points="333.9,206.3 253.3,230.1 284.7,308.1 365.3,284.3"
           fill="#f0fdfa" fill-opacity="0.75" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="352" y="326" font-size="15" fill="#0d9488">접평면 (수평면)</text>

  <!-- NED 삼축 -->
  <line x1="309.3" y1="257.2" x2="286.1" y2="199.7" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#a2n-blue)"/>
  <line x1="309.3" y1="257.2" x2="368.8" y2="239.6" stroke="#0d9488" stroke-width="2.6" marker-end="url(#a2n-teal)"/>
  <line x1="309.3" y1="257.2" x2="259.0" y2="293.5" stroke="#dc2626" stroke-width="2.6" marker-end="url(#a2n-red)"/>
  <circle cx="309.3" cy="257.2" r="5" fill="#1e293b"/>
  <text x="283" y="192" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">N</text>
  <text x="377" y="236" font-size="18" font-weight="bold" fill="#0d9488">E</text>
  <text x="250" y="306" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="end">D</text>
  <text x="318" y="250" font-size="17" font-weight="bold" fill="#1e293b">P</text>

  <!-- ================= 패널 2 ================= -->
  <!-- 비교용 원 -->
  <circle cx="720" cy="320" r="150" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 5"/>
  <!-- 타원체 단면 -->
  <ellipse cx="720" cy="320" rx="150" ry="112" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- 축 -->
  <line x1="570" y1="320" x2="720" y2="320" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="720" y1="320" x2="905" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#a2n-gray)"/>
  <line x1="720" y1="320" x2="720" y2="172" stroke="#334155" stroke-width="2" marker-end="url(#a2n-gray)"/>
  <text x="720" y="160" font-size="17" font-weight="bold" fill="#1e293b" text-anchor="middle">ê3</text>
  <text x="876" y="304" font-size="17" font-weight="bold" fill="#1e293b">t̂1</text>
  <circle cx="720" cy="320" r="3.5" fill="#334155"/>
  <text x="712" y="340" font-size="15" fill="#64748b" text-anchor="end">O</text>

  <!-- 중심에서 본 선 (지심위도) -->
  <line x1="720" y1="320" x2="847.1" y2="260.5" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- 법선 -->
  <line x1="847.1" y1="260.5" x2="900.7" y2="215.5" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="743.7" y1="347.3" x2="847.1" y2="260.5" stroke="#334155" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="898" y="208" font-size="16" fill="#334155" text-anchor="end">법선 (위쪽)</text>

  <!-- N, D -->
  <line x1="847.1" y1="260.5" x2="800.8" y2="205.3" stroke="#1d4ed8" stroke-width="2.6" marker-end="url(#a2n-blue)"/>
  <line x1="847.1" y1="260.5" x2="743.7" y2="347.3" stroke="#dc2626" stroke-width="2.6" marker-end="url(#a2n-red)"/>
  <text x="795" y="198" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="end">N</text>
  <text x="736" y="366" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">D</text>
  <circle cx="847.1" cy="260.5" r="5" fill="#1e293b"/>
  <text x="856" y="252" font-size="17" font-weight="bold" fill="#1e293b">P</text>

  <!-- 각 -->
  <path d="M 818.2 320 A 42 42 0 0 0 808.4 293.0" fill="none" stroke="#0d9488" stroke-width="2.4"/>
  <circle cx="776.2" cy="320" r="3.5" fill="#0d9488"/>
  <text x="824" y="312" font-size="18" font-weight="bold" fill="#0d9488">φ</text>
  <path d="M 772 320 A 52 52 0 0 0 767.1 298.0" fill="none" stroke="#d97706" stroke-width="2.4"/>
  <text x="738" y="300" font-size="18" font-weight="bold" fill="#d97706">φc</text>

  <!-- ================= 범례 ================= -->
  <rect x="20" y="468" width="980" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="496" font-size="16" fill="#334155">N  북 — 자오선을 따라 북극 쪽</text>
  <text x="40" y="522" font-size="16" fill="#334155">E  동 — 위선을 따라 동쪽</text>
  <text x="40" y="548" font-size="16" fill="#334155">D  아래 — 타원체면 법선의 아래쪽</text>
  <text x="520" y="496" font-size="16" fill="#334155">φ    측지위도 — 법선과 적도면의 각 (GPS · 지도의 값)</text>
  <text x="520" y="522" font-size="16" fill="#334155">φc  지심위도 — 중심에서 그 점을 본 각</text>
  <text x="520" y="548" font-size="16" fill="#334155">둘의 차 최대 0.1924° (위도 45.1°) — 섞으면 21.4 km 어긋남</text>

  <text x="36" y="584" font-size="15" fill="#64748b">단면의 찌그러짐은 과장해 그렸다 — 실제 WGS84 는 (a − b) / a = 0.335 % 로 눈으로는 원과 구별되지 않는다</text>
</svg>

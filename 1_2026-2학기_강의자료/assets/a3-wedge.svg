<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="Malgun Gothic, sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#1e293b">±45° 를 걸면 요구 방향에 쐐기 구멍이 생긴다 — 영공간 한 줄로 일부를 메운다</text>

  <defs>
    <marker id="w_b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="w_t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- 요구 방향 원판 (N = 0 단면) -->
  <circle cx="250" cy="258" r="160" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 쐐기 네 군데 -->
  <path d="M 250 258 L 296.2 104.8 L 347.0 130.7 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <path d="M 250 258 L 203.8 104.8 L 153.0 130.7 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <path d="M 250 258 L 296.2 411.2 L 347.0 385.3 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <path d="M 250 258 L 203.8 411.2 L 153.0 385.3 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>

  <!-- 축 -->
  <path d="M 250 258 L 250 420 M 250 258 L 90 258" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 250 258 L 250 78" stroke="#1d4ed8" stroke-width="2" marker-end="url(#w_b)"/>
  <path d="M 250 258 L 430 258" stroke="#1d4ed8" stroke-width="2" marker-end="url(#w_b)"/>
  <text x="250" y="68" font-size="17" fill="#1d4ed8" text-anchor="middle">X (전후)</text>
  <text x="438" y="252" font-size="17" fill="#1d4ed8">Y (횡)</text>

  <!-- 순수 횡이동 방향 -->
  <path d="M 250 258 L 400 258" stroke="#ffffff" stroke-width="7"/>
  <path d="M 250 258 L 400 258" stroke="#0d9488" stroke-width="4" marker-end="url(#w_t)"/>
  <text x="372" y="292" font-size="16" fill="#0d9488" text-anchor="middle">순수 횡이동</text>
  <text x="372" y="313" font-size="16" fill="#0d9488" text-anchor="middle">(23.40° · 열려 있다)</text>

  <text x="358" y="104" font-size="16" fill="#dc2626">X = 3.311 Y</text>
  <text x="358" y="150" font-size="16" fill="#dc2626">X = 1.311 Y</text>

  <circle cx="58" cy="452" r="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="76" y="458" font-size="16" fill="#334155">수도인버스만으로는 ±45° 를 넘는 요구 방향 — 대칭으로 네 군데</text>
  <text x="76" y="482" font-size="16" fill="#64748b">전후·횡을 같이 요구할 때만 생긴다. 전진만·횡이동만 요구하면 생기지 않는다</text>

  <!-- 오른쪽 판 -->
  <rect x="470" y="58" width="420" height="390" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="494" y="92" font-size="18" font-weight="bold" fill="#d97706">메우는 방법 — 코드 네 줄</text>

  <text x="494" y="126" font-size="17" fill="#1e293b">u = [F_x,L  F_y,L  F_x,R  F_y,R]ᵀ</text>
  <text x="494" y="154" font-size="17" fill="#1e293b">B 의 영공간은 1 차원 : n = [0  1  0  −1]ᵀ</text>
  <text x="494" y="182" font-size="16" fill="#64748b">두 추진기에 크기 같고 방향 반대인 횡력</text>
  <text x="494" y="212" font-size="17" fill="#1e293b">u = pinv(B) · τ + λ · n</text>
  <text x="494" y="240" font-size="16" fill="#64748b">λ 를 아무리 바꿔도 X · Y · N 은 그대로다</text>

  <path d="M 494 260 L 866 260" stroke="#fde68a" stroke-width="1.5"/>
  <text x="494" y="290" font-size="17" fill="#1e293b">각도 한계는 선형 조건이다</text>
  <text x="494" y="318" font-size="17" fill="#1e293b">|F_y,i| ≤ tan δ_max · |F_x,i|</text>
  <text x="494" y="344" font-size="16" fill="#64748b">→ λ 의 허용 구간 [lo, hi] 이 닫힌식으로 나온다</text>
  <text x="494" y="370" font-size="16" fill="#64748b">→ 그 구간에서 0 에 가장 가까운 λ 를 쓴다</text>

  <path d="M 494 388 L 866 388" stroke="#fde68a" stroke-width="1.5"/>
  <text x="494" y="416" font-size="17" font-weight="bold" fill="#1e293b">실측 — N = 0 단면 격자에서 낼 수 있는 칸</text>
  <text x="494" y="440" font-size="17" fill="#1e293b">19.7 %  →  25.3 %</text>
</svg>

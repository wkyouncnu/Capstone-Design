  <polygon points="212,212 200,207 200,217" fill="#7c3aed"/>
  <circle cx="30" cy="212" r="4" fill="#7c3aed"/>

  <text x="470" y="288" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">ground_truth_odometry   (nav_msgs/Odometry, 10 Hz)</text>
  <text x="40" y="150" font-size="13" font-weight="700" fill="#1d4ed8">u = twist.twist.linear.x</text>
  <text x="40" y="252" font-size="13" font-weight="700" fill="#0d9488">psi = 쿼터니언에서 계산</text>

  <line x1="30" y1="326" x2="910" y2="326" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="352" font-size="15" fill="#334155">속도와 선수각을 둘 다 참값으로 받으므로 <tspan font-weight="700" fill="#dc2626">EKF 같은 추정기를 만들지 않아도 된다</tspan></text>
  <text x="30" y="378" font-size="15" fill="#64748b">먼저 참값으로 제어기를 완성하고, 추정기로 바꾸는 것은 나중 문제로 미룬다</text>
  <text x="30" y="404" font-size="14" fill="#64748b">b = 1.027 m (추진기 반폭)</text>

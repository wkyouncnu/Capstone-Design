  <text x="697" y="179" font-size="13" fill="#334155" text-anchor="middle">right/thrust</text>

  <rect x="800" y="100" width="122" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>

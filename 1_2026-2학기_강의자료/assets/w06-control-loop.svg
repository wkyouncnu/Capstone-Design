  <rect x="452" y="112" width="132" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="518" y="138" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">차동 배분</text>
  <text x="518" y="160" font-size="13" fill="#334155" text-anchor="middle">F_L = X/2 + N/2b</text>
  <text x="518" y="179" font-size="13" fill="#334155" text-anchor="middle">F_R = X/2 - N/2b</text>

  <rect x="638" y="112" width="118" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>

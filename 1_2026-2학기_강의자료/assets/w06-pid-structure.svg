<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Malgun Gothic, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="19" font-weight="bold" fill="#1e293b">PID — 오차 하나를 세 가지로 읽어 더한다</text>

  <circle cx="90" cy="205" r="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="81" y="200" font-size="15" fill="#dc2626" text-anchor="middle">+</text>
  <text x="81" y="222" font-size="17" fill="#dc2626" text-anchor="middle">−</text>
  <text x="90" y="256" font-size="15" fill="#dc2626" text-anchor="middle">오차 e</text>

  <line x1="30"  y1="205" x2="64"  y2="205" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="30" y="192" font-size="15" fill="#334155">목표</text>

  <polyline points="110,205 155,205 155,95  199,95"  fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>
  <polyline points="155,205 199,205" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>
  <polyline points="155,205 155,315 199,315" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="205" y="68"  width="230" height="54" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="320" y="92"  font-size="16" fill="#92400e" text-anchor="middle">P · 비례</text>
  <text x="320" y="112" font-size="15" fill="#92400e" text-anchor="middle">지금 얼마나 틀렸는가</text>

  <rect x="205" y="178" width="230" height="54" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="320" y="202" font-size="16" fill="#115e59" text-anchor="middle">I · 적분</text>
  <text x="320" y="222" font-size="15" fill="#115e59" text-anchor="middle">얼마나 오래 틀리고 있는가</text>

  <rect x="205" y="288" width="230" height="54" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="320" y="312" font-size="16" fill="#1e40af" text-anchor="middle">D · 미분</text>
  <text x="320" y="332" font-size="15" fill="#1e40af" text-anchor="middle">얼마나 빨리 좁혀지는가</text>

  <text x="448" y="86"  font-size="15" fill="#92400e">Kp · e</text>
  <text x="448" y="196" font-size="15" fill="#115e59">Ki · ∫e dt</text>
  <text x="448" y="306" font-size="15" fill="#1e40af">Kd · de/dt</text>

  <circle cx="600" cy="205" r="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="600" y="212" font-size="19" fill="#334155" text-anchor="middle">+</text>

  <polyline points="435,95  576,95  576,188" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>
  <polyline points="435,205 574,205" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>
  <polyline points="435,315 576,315 576,228" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="680" y="178" width="180" height="54" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="770" y="210" font-size="16" fill="#334155" text-anchor="middle">제어입력 u</text>
  <line x1="620" y1="205" x2="674" y2="205" stroke="#475569" stroke-width="1.8" marker-end="url(#a2)"/>

  <text x="30" y="385" font-size="15" fill="#64748b">P 는 "지금", I 는 "과거", D 는 "곧 다가올 것"을 본다. 세 시점을 더하는 것이 PID 다.</text>
</svg>

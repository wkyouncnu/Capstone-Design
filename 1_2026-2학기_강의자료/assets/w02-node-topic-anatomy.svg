<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="Malgun Gothic, sans-serif">
<rect width="940" height="620" fill="#ffffff"/>

<text x="20" y="32" font-size="19" font-weight="bold" fill="#1e293b">노드와 토픽 — 무엇이 무엇에게 보내는가</text>
<text x="20" y="54" font-size="14" fill="#64748b">아래 이름은 실제로 실행해 확인한 것이다 (ros2/examples 0.15.5)</text>

<!-- ===== 위: 구조 ===== -->
<rect x="40" y="86" width="230" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="155" y="120" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">노드 (Node)</text>
<text x="155" y="144" font-size="14" fill="#334155" text-anchor="middle">/minimal_publisher</text>
<text x="155" y="166" font-size="12" fill="#64748b" text-anchor="middle">0.5초마다 문자열을 만든다</text>

<rect x="360" y="96" width="200" height="76" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="460" y="126" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle">토픽 (Topic)</text>
<text x="460" y="150" font-size="14" fill="#334155" text-anchor="middle">/topic</text>

<rect x="650" y="86" width="240" height="96" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="770" y="120" font-size="16" font-weight="bold" fill="#0d9488" text-anchor="middle">노드 (Node)</text>
<text x="770" y="144" font-size="14" fill="#334155" text-anchor="middle">/minimal_subscriber</text>
<text x="770" y="166" font-size="12" fill="#64748b" text-anchor="middle">받는 대로 화면에 찍는다</text>

<!-- 화살표 -->
<line x1="270" y1="134" x2="352" y2="134" stroke="#334155" stroke-width="2.5"/>
<polygon points="360,134 348,128 348,140" fill="#334155"/>
<text x="311" y="124" font-size="12" fill="#334155" text-anchor="middle">발행</text>
<text x="311" y="156" font-size="11" fill="#64748b" text-anchor="middle">publish</text>

<line x1="560" y1="134" x2="642" y2="134" stroke="#334155" stroke-width="2.5"/>
<polygon points="650,134 638,128 638,140" fill="#334155"/>
<text x="601" y="124" font-size="12" fill="#334155" text-anchor="middle">구독</text>
<text x="601" y="156" font-size="11" fill="#64748b" text-anchor="middle">subscribe</text>

<!-- 메시지 -->
<rect x="352" y="196" width="216" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="460" y="216" font-size="12" fill="#64748b" text-anchor="middle">메시지 타입 (약속된 서식)</text>
<text x="460" y="234" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">std_msgs/msg/String</text>
<line x1="460" y1="172" x2="460" y2="192" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- ===== 가운데: 성질 세 가지 ===== -->
<text x="20" y="290" font-size="16" font-weight="bold" fill="#334155">여기서 나오는 성질 세 가지</text>

<rect x="40" y="304" width="270" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="56" y="328" font-size="14" font-weight="bold" fill="#1d4ed8">① 서로를 모른다</text>
<text x="56" y="350" font-size="12" fill="#334155">발행자는 구독자가 몇인지</text>
<text x="56" y="368" font-size="12" fill="#334155">모른 채 그냥 내보낸다.</text>
<text x="56" y="388" font-size="12" fill="#64748b">→ 노드를 갈아 끼워도 나머지는 그대로</text>

<rect x="332" y="304" width="270" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="348" y="328" font-size="14" font-weight="bold" fill="#0d9488">② 여럿이어도 된다</text>
<text x="348" y="350" font-size="12" fill="#334155">한 토픽에 발행자·구독자가</text>
<text x="348" y="368" font-size="12" fill="#334155">여러 개 붙을 수 있다.</text>
<text x="348" y="388" font-size="12" fill="#64748b">→ 기록·표시·제어를 동시에</text>

<rect x="624" y="304" width="270" height="94" rx="8" fill="#fef2f2" stroke="#dc2626"/>
<text x="640" y="328" font-size="14" font-weight="bold" fill="#dc2626">③ 이름과 타입이 같아야 한다</text>
<text x="640" y="350" font-size="12" fill="#334155">하나라도 다르면 <tspan font-weight="bold">오류 없이</tspan></text>
<text x="640" y="368" font-size="12" fill="#334155">조용히 연결되지 않는다.</text>
<text x="640" y="388" font-size="12" fill="#64748b">→ 가장 흔한 실수. QoS 도 마찬가지</text>

<!-- ===== 아래: 명령 대응 ===== -->
<text x="20" y="446" font-size="16" font-weight="bold" fill="#334155">어느 명령이 어디를 보여 주는가</text>

<rect x="40" y="462" width="230" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-dasharray="5 3"/>
<text x="155" y="487" font-size="13" fill="#1d4ed8" text-anchor="middle">ros2 node list</text>
<line x1="155" y1="462" x2="155" y2="186" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

<rect x="360" y="462" width="200" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 3"/>
<text x="460" y="487" font-size="13" fill="#d97706" text-anchor="middle">ros2 topic list</text>
<line x1="460" y1="462" x2="460" y2="244" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

<rect x="650" y="462" width="240" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-dasharray="5 3"/>
<text x="770" y="487" font-size="13" fill="#0d9488" text-anchor="middle">ros2 node list</text>
<line x1="770" y1="462" x2="770" y2="186" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

<rect x="240" y="522" width="440" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="460" y="546" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">ros2 topic echo /topic</text>
<text x="460" y="568" font-size="12" fill="#64748b" text-anchor="middle">오가는 내용을 가로채서 그대로 보여 준다</text>
<text x="460" y="586" font-size="12" fill="#64748b" text-anchor="middle">= 구독자를 하나 더 붙이는 것과 같다 (성질 ②)</text>
<line x1="460" y1="522" x2="460" y2="506" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
